name: Android SDK
description: Instala as ferramentas de linha de comando usadas pelo Gradle para baixar o SDK.

runs:
  using: composite
  steps:
    - name: Instalar as ferramentas de linha de comando
      shell: bash
      run: |
        set -euo pipefail
        sdk="$RUNNER_TEMP/android-sdk"
        mkdir -p "$sdk/cmdline-tools"
        curl -fsSL -o /tmp/commandlinetools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/commandlinetools.zip -d "$sdk/cmdline-tools"
        mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
        yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
        echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$sdk/platform-tools" >> "$GITHUB_PATH"
